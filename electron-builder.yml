# Windows 打包配置（electron-builder）
#
# 【范围：只做 Windows 安装版】两点都是刻意的：
#  - 没有 mac / linux 的 target —— 项目只支持一个平台。应用本体是网页，原则上能跑在别的
#    系统上；真要做的时候在这里加 target 即可，其余配置（files / 主题目录 / 自检）都不用动；
#  - 没有便携版 —— 只出安装包。多一份上百 MB 的产物，还多一条"数据目录在哪"的分支
#    （便携版会把自己解到临时目录）要维护，用不上就不留。
#
# 产物是**安装版**（NSIS）：有安装向导、能改安装目录、带开始菜单与卸载项。
appId: com.braid.app
productName: Braid
copyright: Braid

# 只打进运行时需要的东西：构建产物 + 主进程 + 示例主题。源码、测试、文档都不进包。
files:
  - dist/**/*
  - electron/**/*
  # 示例主题（asar 内这一份是**兜底**：开发态、以及用户把 themes/ 整个删掉后再补上时用它）
  - themes/**/*
  - package.json

# 示例主题的**另一份**，放在 asar 之外（`resources/themes/`）
#
# 【为什么要放两份】安装器读不到 asar（那是单个文件），而"装完就该有主题目录"这件事
# 必须由安装器来做 —— 所以需要一份安装器读得到、且能直接拷走的原始文件。
#  1. `electron/installer.nsh` 在安装结束时把它拷到 exe 同级的 `themes/`；
#  2. 主进程把它当作示例的首选来源，asar 里那份退居兜底。
extraResources:
  - from: themes
    to: themes
    filter:
      - '**/*'

directories:
  output: release
  buildResources: electron

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Braid-${version}-setup.exe
  # 不做代码签名：个人项目没有证书，强行走进签名流程只会因为缺证书而失败。
  # （代价：Windows 首次运行会弹 SmartScreen 提示，选"仍要运行"即可。）
  signAndEditExecutable: false

nsis:
  # 有向导而不是"点一下直接装"：装哪儿、要不要快捷方式，用户自己定
  oneClick: false
  # 安装结束时把示例主题铺到 exe 同级（见 electron/installer.nsh 里的 customInstall）
  include: electron/installer.nsh
  # 按用户安装（%LOCALAPPDATA%\Programs\Braid）：不弹 UAC，对轻量工具更合适
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Braid
  artifactName: Braid-${version}-setup.exe
  # 【绝不能改成 true】应用的数据在 %APPDATA%\Braid（OPFS 上的 SQLite = 用户全部会话）。
  # 卸载时删掉它等于把用户的对话一并抹了 —— 那是最不可挽回的一类事故。
  deleteAppDataOnUninstall: false

